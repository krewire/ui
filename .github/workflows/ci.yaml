name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Krewire UI Component Library Continuous Integration Pipeline (ADR-R7P3K)
# Read-only quality gates validating all 10 UI constituent modules:
# components, core, dsl, editors, form, kiw, node, panel, styles, widget.
# Triggered on pull requests and pushes to main.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.3"

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "::error title=gofmt::unformatted files (run gofmt -w):"
            echo "$UNFORMATTED"
            exit 1
          fi

  mod-verify:
    name: mod-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Module Manifest Verification
        run: |
          for mod in components core dsl editors form kiw node panel styles widget; do
            echo "▶ Verifying module manifests in ${mod}..."
            (cd "${mod}" && go mod verify)
          done

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Static Analysis (go vet)
        run: go vet ./components/... ./core/... ./dsl/... ./editors/... ./form/... ./kiw/... ./node/... ./panel/... ./styles/... ./widget/...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run Test Suite & Contract Checks
        run: go test -v ./components/... ./core/... ./dsl/... ./editors/... ./form/... ./kiw/... ./node/... ./panel/... ./styles/... ./widget/...

  build:
    name: build-purego
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Pure-Go Compilation Invariant
        run: CGO_ENABLED=0 go build ./components/... ./core/... ./dsl/... ./editors/... ./form/... ./kiw/... ./node/... ./panel/... ./styles/... ./widget/...

  ci-ok:
    name: ci-ok
    if: always()
    needs: [gofmt, mod-verify, vet, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All quality gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error title=ci-ok::at least one quality gate did not succeed"
              exit 1
            fi
          done
